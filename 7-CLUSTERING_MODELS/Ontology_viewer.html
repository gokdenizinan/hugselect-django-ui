<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4RSE Ontology Viewer — Radial, Expand-on-Demand</title>

    <!-- D3 v7 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <!-- N3.js for Turtle parsing -->
    <script src="https://cdn.jsdelivr.net/npm/n3@1.17.4/browser/n3.min.js"></script>

    <style>
        :root {
            --bg: #0e1117;
            --panel: #121826;
            --stage: #0b1020;
            --text: #e6edf3;
            --muted: #a7b0c0;
            --grid: #182036;
            --top: #7aa2ff;
            --super: #6ee7b7;
            --cluster: #f59e0b;
            --lowest: #eab308;
            --inst: #f6c85f;
            --concept: #94a3b8;
            --link: #5a6687;
            --linkInst: #fbbf24;
            --sel: #22c55e;
            --warn: #ef4444;
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.35 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial
        }

        .app {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 100%
        }

        header {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            background: var(--panel);
            border-bottom: 1px solid #1b2340;
            position: sticky;
            top: 0;
            z-index: 5;
        }

            header h1 {
                margin: 0;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: .2px
            }

        .sep {
            flex: 1
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .btn, .file-label, input[type="text"] {
            background: #0e1426;
            border: 1px solid #1b2340;
            color: var(--text);
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer
        }

            .btn:hover, .file-label:hover {
                background: #121b36
            }

        input[type="text"] {
            min-width: 280px
        }

        input[type=file] {
            display: none
        }

        .hint {
            color: var(--muted)
        }

        .stage-wrap {
            position: relative;
            background: var(--stage)
        }

        svg {
            display: block;
            width: 100%;
            height: 100vh
        }

        .grid line {
            stroke: var(--grid);
            stroke-opacity: .6;
            shape-rendering: crispEdges
        }

        .link {
            stroke: var(--link);
            stroke-opacity: .6
        }

            .link.instances {
                stroke: var(--linkInst);
                stroke-opacity: .85
            }

            .link.highlight {
                stroke: var(--sel);
                stroke-width: 2.2px;
                stroke-opacity: 1
            }

        .node {
            cursor: pointer
        }

            .node circle {
                stroke: #1f2937;
                stroke-width: 1
            }

            .node .label {
                pointer-events: none;
                font-size: 11px;
                fill: var(--text);
                text-shadow: 0 1px 2px rgba(0,0,0,.35)
            }

            .node .sub {
                pointer-events: none;
                font-size: 10px;
                fill: #a5b4fc
            }

            .node.top circle {
                fill: var(--top)
            }

            .node.super circle {
                fill: var(--super)
            }

            .node.cluster circle {
                fill: var(--cluster)
            }

            .node.lowest circle {
                fill: var(--lowest)
            }

            .node.instances .cyl {
                fill: var(--inst);
                stroke: #b48b2c;
                stroke-width: 1
            }

            .node.concept circle {
                fill: var(--concept)
            }

            .node.selected circle, .node.selected .cyl {
                stroke: var(--sel);
                stroke-width: 2
            }

            .node.expanded circle, .node.expanded .cyl {
                stroke: #22d3ee;
                stroke-width: 1.8
            }

        .badge {
            font-size: 12px;
            padding: 6px 8px;
            border-radius: 999px;
            border: 1px solid #1b2340;
            background: #0e1426;
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%
        }

        .dock {
            border-top: 1px solid #1b2340;
            background: var(--panel);
            padding: 10px 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap
        }

        .card {
            background: #0e1426;
            border: 1px solid #1b2340;
            border-radius: 14px;
            padding: 12px;
            min-width: 260px;
            max-width: 50vw
        }

            .card h3 {
                margin: 0 0 6px 0;
                font-size: 14px
            }

        .kv {
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 6px 10px
        }

            .kv div {
                min-width: 0
            }

        .def {
            white-space: pre-wrap
        }

        .pill {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid #263055;
            background: #0b1328;
            color: #c7d2fe
        }

        .muted {
            color: var(--muted)
        }

        .warn {
            color: var(--warn)
        }

        .toast {
            position: absolute;
            right: 12px;
            top: 12px;
            background: #0e1426;
            border: 1px solid #1b2340;
            padding: 8px 10px;
            border-radius: 10px;
            color: var(--text)
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>AI4RSE Ontology Viewer</h1>
            <span class="hint">SKOS/IEEE taxonomy + Instances + Concepts</span>
            <div class="sep"></div>
            <label class="file-label">
                <input id="file" type="file" accept=".ttl,.n3,.txt" />
                Load TTL
            </label>
            <input id="search" type="text" placeholder="Search labels… (Enter to expand to result)" />
            <button id="btnReveal" class="btn">Reveal results</button>
            <button id="btnFit" class="btn">Fit</button>
            <button id="btnCollapse" class="btn">Collapse all</button>
        </header>

        <div class="stage-wrap" id="stageWrap">
            <svg id="stage">
                <defs>
                    <!-- database cylinder symbol -->
                    <g id="cylinder" stroke="#1f2937">
                        <ellipse cx="0" cy="-10" rx="14" ry="6"></ellipse>
                        <rect x="-14" y="-10" width="28" height="20" rx="5" ry="5"></rect>
                        <ellipse cx="0" cy="10" rx="14" ry="6" fill="none"></ellipse>
                    </g>
                    <!-- arrow marker -->
                    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"></path>
                    </marker>
                    <marker id="arrowInst" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"></path>
                    </marker>
                </defs>
                <g class="grid"></g>
                <g class="links"></g>
                <g class="nodes"></g>
            </svg>
            <div id="toast" class="toast" style="display:none;"></div>
        </div>

        <!-- Bottom details dock -->
        <div class="dock" id="dock">
            <div class="card" id="summary">
                <h3>Selection</h3>
                <div class="muted">Click any node to see details here. Double-click a node to expand/collapse its children laid out on a circle.</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ---------- Config ----------
            const NS = {
                skos: "http://www.w3.org/2004/02/skos/core#",
                rdfs: "http://www.w3.org/2000/01/rdf-schema#",
                dct: "http://purl.org/dc/terms/",
                rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#",
                ex: "http://example.org/onto/"
            };

            const PRED = {
                broader: NS.skos + "broader",              // child skos:broader parent
                prefLabel: NS.skos + "prefLabel",
                label: NS.rdfs + "label",
                definition: NS.skos + "definition",
                comment: NS.rdfs + "comment",
                description: NS.dct + "description",
                hasPath: NS.ex + "hasPath",
                hasLevel: NS.ex + "labelLevel",
                type: NS.rdf + "type",
                hasInstancesGroup: NS.ex + "hasInstancesGroup", // taxonomy -> instances
                memberOf: NS.ex + "memberOf"                     // concept -> instances
            };

            // Types we recognize (strings are local names usually emitted by your generator)
            const TYPES = {
                Top: "Top",
                SuperCluster: "SuperCluster",
                Cluster: "Cluster",
                LowestCluster: "LowestCluster",
                Instances: "Instances",
                Concept: "Concept"
            };

            // Node styling sizes
            const SIZE = {
                Top: 16,
                SuperCluster: 14,
                Cluster: 12,
                LowestCluster: 11,
                Instances: 14,
                Concept: 7
            };

            // Performance knobs for large graphs
            const MAX_CHILDREN_RENDER = 4000;  // safeguard per expansion for UI
            const COLLIDE_PAD = 2.5;           // extra padding for forceCollide

            // ---------- State ----------
            const IDX = {
                nodes: new Map(),   // id -> node
                children: new Map(),// parentId -> Set(childId)
                parent: new Map(),  // childId -> parentId
                links: [],          // all links {source, target, kind}
                roots: new Set(),   // computed roots (taxonomy tops)
                instancesOf: new Map(), // instancesId -> Set(conceptId)
                instParent: new Map(),  // instancesId -> taxonomyNodeId
            };

            // nodes/links currently rendered (expand-on-demand)
            const VIS = {
                nodes: new Map(),  // id -> node proxy (x,y,vx,vy, etc.)
                links: [],         // visible links
                expanded: new Set(), // ids expanded
                selected: null,
                searchHits: []
            };

            // ---------- DOM refs ----------
            const elFile = document.getElementById("file");
            const elSearch = document.getElementById("search");
            const elReveal = document.getElementById("btnReveal");
            const elFit = document.getElementById("btnFit");
            const elCollapse = document.getElementById("btnCollapse");
            const elStage = d3.select("#stage");
            const gGrid = elStage.select(".grid");
            const gLinks = elStage.select(".links");
            const gNodes = elStage.select(".nodes");
            const elToast = document.getElementById("toast");
            const elDock = document.getElementById("dock");
            const elSummary = document.getElementById("summary");

            // ---------- Grid ----------
            drawGrid();
            function drawGrid() {
                const step = 40, w = 4000, h = 4000, ox = -2000, oy = -2000;
                const xs = d3.range(ox, ox + w + 1, step);
                const ys = d3.range(oy, oy + h + 1, step);
                gGrid.selectAll(".gx").data(xs).join("line")
                    .attr("class", "gx")
                    .attr("x1", d => d).attr("y1", oy)
                    .attr("x2", d => d).attr("y2", oy + h);
                gGrid.selectAll(".gy").data(ys).join("line")
                    .attr("class", "gy")
                    .attr("x1", ox).attr("y1", d => d)
                    .attr("x2", ox + w).attr("y2", d => d);
            }

            // ---------- Zoom / Pan ----------
            const zoom = d3.zoom().scaleExtent([0.08, 4]).on("zoom", (ev) => {
                const t = ev.transform;
                gGrid.attr("transform", t);
                gLinks.attr("transform", t);
                gNodes.attr("transform", t);
            });
            elStage.call(zoom);

            // ---------- Simulation ----------
            const sim = d3.forceSimulation()
                .alphaDecay(0.05)
                .velocityDecay(0.3)
                .force("charge", d3.forceManyBody().strength(-30))
                .force("collide", d3.forceCollide().radius(d => (d.r || 8) + COLLIDE_PAD))
                // link force only to keep parent/child springy; we guide shape with custom orbit
                .force("link", d3.forceLink().id(d => d.id).distance(30).strength(0.08))
                .force("center", d3.forceCenter(0, 0))
                .on("tick", ticked);

            // Custom orbit force that keeps children on a circle around parent and follows parent motion
            function forceOrbit(alpha) {
                // Build parent->children visible map on each tick (cheap for visible subset)
                const expParents = [...VIS.expanded].map(id => VIS.nodes.get(id)).filter(Boolean);
                for (const p of expParents) {
                    const kids = (p.childIds || []).filter(id => VIS.nodes.has(id)).map(id => VIS.nodes.get(id));
                    if (!kids.length) continue;

                    // Compute radius based on how many and their sizes so circumference >= sum of diameters
                    const dAvg = d3.mean(kids, k => (k.r || 8) * 2 + 6) || 20;
                    const Rmin = 60; // ensure spacing away from parent
                    const R = Math.max(Rmin, (kids.length * dAvg) / (2 * Math.PI));

                    // Space children evenly around circle
                    for (let i = 0; i < kids.length; i++) {
                        const child = kids[i];
                        const angle = (i / kids.length) * Math.PI * 2 + (p.orbitOffset || 0);
                        const tx = p.x + R * Math.cos(angle);
                        const ty = p.y + R * Math.sin(angle);
                        // gently pull child toward its orbit target
                        child.vx += (tx - child.x) * 0.08 * alpha;
                        child.vy += (ty - child.y) * 0.08 * alpha;
                    }
                    // Slowly rotate the orbit for a subtle dynamic
                    p.orbitOffset = (p.orbitOffset || 0) + 0.002 * alpha;
                }
            }

            // Hook custom force into simulation
            sim.force("orbit", forceOrbit);

            function ticked() {
                // Links
                gLinks.selectAll("line")
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                // Nodes
                gNodes.selectAll("g.node")
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            }

            // ---------- IO: load TTL ----------
            elFile.addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const text = await file.text();
                loadTTL(text);
            });

            // ---------- Parse TTL & Build indexes ----------
            async function loadTTL(ttlText) {
                resetAll();

                // Parse
                const parser = new N3.Parser();
                const quads = parser.parse(ttlText);

                // First pass: ensure nodes exist; collect labels, types, defs
                for (const q of quads) {
                    const s = asTerm(q.subject);
                    const p = asTerm(q.predicate);
                    const o = asTerm(q.object);

                    ensureNode(s);

                    // Labels and definitions
                    if (p === PRED.prefLabel || p === PRED.label) {
                        IDX.nodes.get(s).label = asLiteral(o) || o;
                    }
                    if (p === PRED.definition || p === PRED.comment || p === PRED.description) {
                        const def = asLiteral(o);
                        if (def) {
                            const n = IDX.nodes.get(s);
                            n.definitions = n.definitions || [];
                            n.definitions.push(def);
                        }
                    }

                    // Types
                    if (p === PRED.type) {
                        const local = localName(o);
                        const n = IDX.nodes.get(s);
                        n.types = n.types || new Set();
                        n.types.add(local);
                    }
                }

                // Second pass: relations
                for (const q of quads) {
                    const s = asTerm(q.subject);
                    const p = asTerm(q.predicate);
                    const o = asTerm(q.object);

                    if (p === PRED.broader) {
                        // child skos:broader parent
                        ensureNode(o);
                        addEdge(o, s, "hier"); // parent -> child
                    }

                    if (p === PRED.hasInstancesGroup) {
                        ensureNode(o);
                        IDX.instParent.set(o, s);  // instances -> taxonomy parent
                        addEdge(s, o, "hier");     // parent -> instances
                    }

                    if (p === PRED.memberOf) {
                        ensureNode(o);
                        // concept -> instances (we keep the edge and also record instances membership)
                        let set = IDX.instancesOf.get(o);
                        if (!set) { set = new Set(); IDX.instancesOf.set(o, set); }
                        set.add(s);
                        addEdge(o, s, "member"); // instances -> concept (for drawing)
                    }
                }

                // Compute roots (taxonomy) = nodes that are parents but have no parent themselves
                const candidateParents = new Set(IDX.children.keys());
                for (const [child, parent] of IDX.parent) {
                    if (candidateParents.has(child)) candidateParents.delete(child);
                }
                IDX.roots = candidateParents;

                // Finalize node types, radii, child arrays
                for (const [id, node] of IDX.nodes) {
                    node.id = id;
                    node.label = node.label || shortId(id);
                    node.types = node.types || new Set();

                    // classify to one of our display buckets
                    const typeName = classifyType(node.types);
                    node.kind = typeName;
                    node.r = SIZE[typeName] || 10;

                    const kids = IDX.children.get(id);
                    node.childIds = kids ? [...kids] : [];
                }

                // Start scene: show roots and one level below
                const rootIds = [...IDX.roots];
                if (!rootIds.length) {
                    toast("No SKOS roots detected; creating a virtual root.");
                    // Build a super root to avoid any hanging items
                    const ROOT = "__ROOT__";
                    const rootNode = { id: ROOT, label: "ROOT", kind: "Top", r: SIZE.Top };
                    IDX.nodes.set(ROOT, rootNode);
                    const allTop = [...IDX.nodes.keys()].filter(id => !IDX.parent.has(id) && id !== ROOT);
                    for (const id of allTop) {
                        addEdge(ROOT, id, "hier");
                    }
                    rootNode.childIds = allTop;
                    rootIds.push(ROOT);
                }

                // Seed visible graph
                for (const rid of rootIds) {
                    addVisible(rid, { x: Math.random() * 200 - 100, y: Math.random() * 200 - 100 });
                }
                // expand roots once
                for (const rid of rootIds) {
                    expandNode(rid, /*initial*/true);
                }

                // kick simulation
                syncSim();
                fitToView();
                toast("Loaded " + IDX.nodes.size + " nodes / " + IDX.links.length + " links (rendering expanded subset).");
            }

            function addEdge(parentId, childId, kind) {
                // parent -> child directional link
                if (!IDX.children.has(parentId)) IDX.children.set(parentId, new Set());
                IDX.children.get(parentId).add(childId);
                IDX.parent.set(childId, parentId);
                IDX.links.push({ source: parentId, target: childId, kind });
            }

            function ensureNode(id) {
                if (!IDX.nodes.has(id)) {
                    IDX.nodes.set(id, { id, label: shortId(id), types: new Set() });
                }
            }

            function classifyType(typeSet) {
                if (!typeSet || !typeSet.size) return TYPES.Cluster; // default
                if (typeSet.has(TYPES.Instances)) return TYPES.Instances;
                if (typeSet.has(TYPES.Concept)) return TYPES.Concept;
                if (typeSet.has(TYPES.Top)) return TYPES.Top;
                if (typeSet.has(TYPES.SuperCluster)) return TYPES.SuperCluster;
                if (typeSet.has(TYPES.LowestCluster)) return TYPES.LowestCluster;
                if (typeSet.has(TYPES.Cluster)) return TYPES.Cluster;
                // fallback
                return TYPES.Cluster;
            }

            // ---------- Visible graph management ----------
            function addVisible(id, pos) {
                if (VIS.nodes.has(id)) return VIS.nodes.get(id);
                const base = IDX.nodes.get(id);
                const n = Object.assign({}, base);
                // initial random-ish position
                n.x = (pos && pos.x) || (Math.random() * 600 - 300);
                n.y = (pos && pos.y) || (Math.random() * 400 - 200);
                VIS.nodes.set(id, n);
                return n;
            }

            function addVisibleLink(srcId, tgtId, kind) {
                const s = VIS.nodes.get(srcId);
                const t = VIS.nodes.get(tgtId);
                if (!s || !t) return;
                // avoid duplicates
                const exists = VIS.links.find(e => ((e.source.id || e.source) === srcId) && ((e.target.id || e.target) === tgtId));
                if (!exists) VIS.links.push({ source: s, target: t, kind });
            }

            function expandNode(id, initial = false) {
                const node = VIS.nodes.get(id);
                if (!node) return;

                const kidsAll = node.childIds || [];
                if (!kidsAll.length) return;

                const kids = kidsAll.slice(0, MAX_CHILDREN_RENDER); // safety cap
                const ang0 = Math.random() * Math.PI * 2;

                for (let i = 0; i < kids.length; i++) {
                    const cid = kids[i];
                    // ensure parent visible before child: prevents hanging nodes
                    addVisible(id);

                    const angle = ang0 + (i / kids.length) * Math.PI * 2;
                    const radius = 120; // initial placement radius; orbit force will re-space
                    const pos = { x: node.x + radius * Math.cos(angle), y: node.y + radius * Math.sin(angle) };

                    addVisible(cid, pos);
                    // link must be present
                    const link = IDX.links.find(e => e.source === id && e.target === cid);
                    addVisibleLink(id, cid, link ? link.kind : "hier");

                    // If this child is an Instances group, also materialize its member concepts (collapsed by default)
                    const childNode = VIS.nodes.get(cid);
                    if (childNode.kind === TYPES.Instances) {
                        const set = IDX.instancesOf.get(cid);
                        if (set) {
                            // instances children are attached as node.childIds already via edges; we don't auto-expand here
                        }
                    }
                }
                VIS.expanded.add(id);
                node.expanded = true;
                render();
                if (!initial) syncSim();
            }

            function collapseNode(id) {
                // remove all descendants of id from visible graph (but keep id itself)
                const toRemove = new Set();
                const stack = [...(IDX.children.get(id) || [])];
                while (stack.length) {
                    const cur = stack.pop();
                    toRemove.add(cur);
                    const ch = IDX.children.get(cur);
                    if (ch) stack.push(...ch);
                }
                // Keep nodes that are still needed by another visible parent (shouldn't happen in a tree, but guard)
                for (const nid of toRemove) {
                    if (VIS.expanded.has(nid)) VIS.expanded.delete(nid);
                    VIS.nodes.delete(nid);
                }
                // Rebuild visible links
                VIS.links = [];
                for (const [nid, n] of VIS.nodes) {
                    const kids = n.childIds || [];
                    for (const cid of kids) {
                        if (VIS.nodes.has(cid)) {
                            const link = IDX.links.find(e => e.source === nid && e.target === cid);
                            addVisibleLink(nid, cid, link ? link.kind : "hier");
                        }
                    }
                }
                VIS.expanded.delete(id);
                const node = VIS.nodes.get(id);
                if (node) node.expanded = false;
                render();
                syncSim();
            }

            function toggleNode(id) {
                if (VIS.expanded.has(id)) collapseNode(id); else expandNode(id);
            }

            // ---------- Render ----------
            function render() {
                // LINKS
                const L = gLinks.selectAll("line").data(VIS.links, d => d.source.id + "->" + d.target.id);
                L.join(
                    enter => enter.append("line")
                        .attr("class", d => "link " + (d.kind === "member" ? "instances" : ""))
                        .attr("marker-end", d => d.kind === "member" ? "url(#arrowInst)" : "url(#arrow)"),
                    update => update,
                    exit => exit.remove()
                );

                // NODES
                const nodesData = [...VIS.nodes.values()];
                const N = gNodes.selectAll("g.node").data(nodesData, d => d.id);
                const Nenter = N.enter().append("g")
                    .attr("class", d => "node " + classFor(d))
                    .call(d3.drag()
                        .on("start", (ev, d) => {
                            if (!ev.active) sim.alphaTarget(0.2).restart();
                            d.fx = d.x; d.fy = d.y;
                        })
                        .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
                        .on("end", (ev, d) => {
                            if (!ev.active) sim.alphaTarget(0);
                            d.fx = null; d.fy = null;
                        })
                    )
                    .on("click", (ev, d) => { selectNode(d.id); ev.stopPropagation(); })
                    .on("dblclick", (ev, d) => { toggleNode(d.id); ev.stopPropagation(); });

                // draw shape
                Nenter.each(function (d) {
                    const g = d3.select(this);
                    if (d.kind === TYPES.Instances) {
                        g.append("use").attr("href", "#cylinder").attr("class", "cyl");
                    } else {
                        g.append("circle").attr("r", d.r || 10);
                    }
                    g.append("text").attr("class", "label").attr("y", - (d.r || 10) - 6)
                        .attr("text-anchor", "middle")
                        .text(d.label);
                });

                N.merge(Nenter)
                    .attr("class", d => "node " + classFor(d) + (d.expanded ? " expanded" : "") + (VIS.selected === d.id ? " selected" : ""));

                N.exit().remove();
            }

            function classFor(d) {
                if (d.kind === TYPES.Top) return "top";
                if (d.kind === TYPES.SuperCluster) return "super";
                if (d.kind === TYPES.Cluster) return "cluster";
                if (d.kind === TYPES.LowestCluster) return "lowest";
                if (d.kind === TYPES.Instances) return "instances";
                if (d.kind === TYPES.Concept) return "concept";
                return "cluster";
            }

            function syncSim() {
                sim.nodes([...VIS.nodes.values()]);
                sim.force("link").links(VIS.links);
                sim.alpha(0.8).restart();
            }

            // ---------- Selection + Dock ----------
            function selectNode(id) {
                VIS.selected = id;
                render();
                const n = IDX.nodes.get(id);
                showDetails(n);
                highlightPath(id);
            }

            function showDetails(n) {
                // Build a nice details card; show definition(s) for Concept
                const defs = (n.definitions || []).join("\n\n");
                const kind = n.kind || "Node";
                const parent = IDX.parent.get(n.id);
                const path = collectPath(n.id).map(pid => IDX.nodes.get(pid)?.label || pid).join("  ›  ");

                elSummary.innerHTML = `
          <h3>${escapeHTML(n.label)}</h3>
          <div class="kv">
            <div class="muted">Type</div><div><span class="pill">${escapeHTML(kind)}</span></div>
            <div class="muted">ID</div><div class="muted">${escapeHTML(n.id)}</div>
            <div class="muted">Path</div><div class="muted">${escapeHTML(path || "(root)")}</div>
          </div>
          ${kind === TYPES.Concept && defs ? `
            <div style="height:8px"></div>
            <div class="pill">Definition</div>
            <div class="def" style="margin-top:8px">${escapeHTML(defs)}</div>
          ` : (defs ? `
            <div style="height:8px"></div>
            <div class="pill">Description</div>
            <div class="def" style="margin-top:8px">${escapeHTML(defs)}</div>
          ` : `
            <div style="height:8px"></div>
            <div class="muted">No definition/description found on this node.</div>
          `)}
        `;
            }

            function collectPath(id) {
                const path = [];
                let cur = id;
                while (IDX.parent.has(cur)) {
                    const p = IDX.parent.get(cur);
                    path.unshift(p);
                    cur = p;
                }
                return path;
            }

            function highlightPath(id) {
                const chain = new Set([id, ...collectPath(id)]);
                gLinks.selectAll("line").classed("highlight", d => chain.has(d.source.id) && chain.has(d.target.id));
                setTimeout(() => gLinks.selectAll("line").classed("highlight", false), 1200);
            }

            // ---------- Search ----------
            elSearch.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    runSearch();
                }
            });
            elReveal.addEventListener("click", runSearch);

            function runSearch() {
                const q = elSearch.value.trim().toLowerCase();
                if (!q) { VIS.searchHits = []; toast("Cleared search."); return; }

                const hits = [];
                for (const [id, n] of IDX.nodes) {
                    if (n.label && n.label.toLowerCase().includes(q)) hits.push(id);
                }
                VIS.searchHits = hits;
                toast(`Found ${hits.length} node(s). Expanding paths to first 50…`);

                // Expand paths to the first 50 hits to avoid flooding
                const max = Math.min(50, hits.length);
                for (let i = 0; i < max; i++) {
                    revealNode(hits[i]);
                }
                render();
                syncSim();
            }

            function revealNode(id) {
                // Expand ancestors so that the node becomes visible
                const path = [...collectPath(id), id];
                for (const pid of path) {
                    if (!VIS.nodes.has(pid)) {
                        const parent = IDX.parent.get(pid);
                        addVisible(pid, VIS.nodes.get(parent) || { x: 0, y: 0 });
                    }
                    // ensure link presence
                    if (IDX.parent.has(pid)) {
                        const par = IDX.parent.get(pid);
                        addVisibleLink(par, pid, (IDX.links.find(e => e.source === par && e.target === pid)?.kind || "hier"));
                    }
                }
                // expand each ancestor so children ring is computed
                for (const pid of path.slice(0, -1)) {
                    expandNode(pid);
                }
            }

            // ---------- Fit / Collapse ----------
            elFit.addEventListener("click", fitToView);
            elCollapse.addEventListener("click", () => {
                // keep current roots only
                const keep = new Set();
                for (const rid of IDX.roots) keep.add(rid);
                const newNodes = new Map();
                for (const rid of keep) newNodes.set(rid, VIS.nodes.get(rid) || addVisible(rid, { x: 0, y: 0 }));
                VIS.nodes = newNodes;
                VIS.links = [];
                VIS.expanded.clear();
                render();
                syncSim();
                fitToView();
            });

            function fitToView() {
                const nodes = [...VIS.nodes.values()];
                if (!nodes.length) return;
                const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
                const minX = Math.min(...xs), maxX = Math.max(...xs);
                const minY = Math.min(...ys), maxY = Math.max(...ys);
                const w = maxX - minX, h = maxY - minY;
                const { width: vw, height: vh } = document.getElementById("stage").getBoundingClientRect();
                const scale = Math.max(0.1, Math.min(3, 0.9 * Math.min(vw / Math.max(1, w), vh / Math.max(1, h))));
                const tx = (vw - scale * (minX + maxX)) / 2;
                const ty = (vh - scale * (minY + maxY)) / 2;
                elStage.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
            }

            // ---------- Utils ----------
            function asTerm(t) { return t.id || t.value || t; }
            function asLiteral(o) {
                if (typeof o === "string") return o;
                if (o.termType === "Literal") return o.value;
                if (o.datatype && o.value) return o.value;
                return null;
            }
            function shortId(iri) {
                if (!iri) return "";
                const hash = iri.lastIndexOf("#");
                const slash = iri.lastIndexOf("/");
                const i = Math.max(hash, slash);
                return iri.slice(i + 1);
            }
            function localName(iri) {
                return shortId(iri);
            }
            function escapeHTML(s) {
                return String(s || "").replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            }
            function toast(msg) {
                elToast.textContent = msg;
                elToast.style.display = "block";
                clearTimeout(toast._t);
                toast._t = setTimeout(() => elToast.style.display = "none", 1800);
            }

            function resetAll() {
                // clear all indexes/state and DOM
                IDX.nodes.clear(); IDX.children.clear(); IDX.parent.clear();
                IDX.links = []; IDX.roots.clear(); IDX.instancesOf.clear(); IDX.instParent.clear();

                VIS.nodes.clear(); VIS.links = []; VIS.expanded.clear(); VIS.selected = null; VIS.searchHits = [];
                gNodes.selectAll("*").remove();
                gLinks.selectAll("*").remove();
                render();
            }

            // ---------- Click background to clear selection ----------
            elStage.on("click", () => {
                VIS.selected = null; render();
                elSummary.innerHTML = `<h3>Selection</h3><div class="muted">Click any node to see details here. Double-click a node to expand/collapse its children laid out on a circle.</div>`;
            });

            // ---------- Optional: auto-load a TTL dropped onto the window ----------
            window.addEventListener("dragover", e => { e.preventDefault(); });
            window.addEventListener("drop", async e => {
                e.preventDefault();
                const file = [...e.dataTransfer.files][0];
                if (file && file.name.endsWith(".ttl")) {
                    const text = await file.text();
                    loadTTL(text);
                }
            });

            // If you want to auto-open a local file path (e.g., when served), you could fetch it here.
            // Keeping it manual for security reasons.

        })();
    </script>
</body>
